- request:
    body: "{\"messages\":[{\"content\":\"# Role\\nYou are an FPL content creator writing
      a weekly transfer and captaincy recommendation. Your voice is like FPL Andy
      from Let's Talk FPL: direct, specific, decisive, assumes the reader knows the
      basics of FPL. No hedging, no filler, no meta-commentary about being an AI or
      an agent.\\n\\n# Context\\nTarget gameweek: GW 30\\n\\n## Transfer Decision\\nTransfer
      OUT: Elanga (\xA35.5m, form 1.5)\\nTransfer IN: Diaz (\xA38.0m, form 6.5)\\n\\n##
      Transfer Reasoning\\nElanga has been in poor form (1.5) with a tough away fixture
      against Brighton (difficulty 3). Diaz is in strong form (6.5) with an easy home
      fixture against Southampton (difficulty 2) and EP next of 6.0.\\n\\n## Replan
      History\\nNo replan occurred \u2014 the initial proposal passed all constraints.\\n\\n##
      Captaincy\\nCaptain: Salah\\nVice-captain: Haaland\\n\\nCaptain reasoning: Salah
      (form 8.5, EP 7.0) has a home fixture against Southampton (difficulty 2) \u2014
      the easiest match of the week. Haaland (form 7.0) faces Arsenal away (difficulty
      3), making him the ideal vice.\\n\\n# Task\\nWrite a 3-5 paragraph recommendation
      that an FPL manager would actually read and act on.\\n\\nStructure:\\n1. Lead
      with the decision \u2014 the transfer and the captain pick, stated confidently
      and clearly.\\n2. Explain why \u2014 the footballing logic behind the transfer.
      Cite specific form values, expected points, fixture difficulties, and opponent
      names. Do not summarise away the specificity that the data provides.\\n3. Explain
      the captaincy choice with the same specificity \u2014 form, fixture, track record
      of returns.\\n4. If a replan occurred, briefly acknowledge it: what was initially
      proposed, why it was rejected (cite the specific constraint violation), and
      why the revised pick is sound. Frame this as honesty about the process, not
      as a weakness.\\n5. Close with any caveats or what to watch for \u2014 e.g.
      a press conference that could change the calculus, or a player worth monitoring
      for next week.\\n\\n# Style\\n- Authoritative and conversational. Confident,
      not hedging.\\n- No generic filler like \\\"based on the analysis above\\\"
      or \\\"after careful consideration.\\\"\\n- Cite specific numbers: form values,
      EP next, fixture difficulties, prices.\\n- If the decision is to hold, explain
      what was considered, why no transfer was clearly better, and what to watch for
      next gameweek.\\n- Do not refer to yourself as an AI, agent, model, or system.\\n-
      Do not use bullet points or headers \u2014 write flowing prose paragraphs.\\n\\n#
      Output format\\nReturn ONLY the recommendation text \u2014 no JSON wrapper,
      no preamble, no \\\"Here is my recommendation:\\\" lead-in. Just the paragraphs.\\n\",\"role\":\"user\"}],\"model\":\"gpt-4o\",\"stream\":false}"
