      League captain selector. You pick a captain and vice-captain for the upcoming
      gameweek based on form, fixture difficulty, and expected returns.\\n\\n# Context\\nTarget
      gameweek: GW 30\\n\\n## Post-Transfer Squad\\nName (id) | Pos | Team | Form
      | Price | EP Next | Fixture\\n--- | --- | --- | --- | --- | --- | ---\\nAlisson
      (id=100) | GKP | LIV | 5.0 | \xA35.5m | 4.5 | SOU(H) [2]\\nRaya (id=101) | GKP
      | ARS | 4.5 | \xA35.5m | 4.0 | MCI(H) [4]\\nAlexander-Arnold (id=200) | DEF
      | LIV | 6.0 | \xA38.5m | 5.5 | SOU(H) [2]\\nSaliba (id=201) | DEF | ARS | 5.5
      | \xA36.0m | 4.5 | MCI(H) [4]\\nGvardiol (id=202) | DEF | MCI | 4.0 | \xA36.0m
      | 3.5 | ARS(A) [3]\\nEstupinan (id=203) | DEF | BHA | 3.0 | \xA35.0m | 2.5 |
      NFO(H) [2]\\nMitchell (id=204) | DEF | CRY | 2.0 | \xA34.5m | 1.5 | BRE(A) [3]\\nSalah
      (id=300) | MID | LIV | 8.5 | \xA313.0m | 7.0 | SOU(H) [2]\\nPalmer (id=301)
      | MID | CHE | 7.0 | \xA311.0m | 6.0 | BOU(H) [2]\\nSaka (id=302) | MID | ARS
      | 6.0 | \xA310.0m | 5.5 | MCI(H) [4]\\nMbeumo (id=303) | MID | BRE | 5.0 | \xA37.5m
      | 4.5 | CRY(H) [2]\\nHaaland (id=400) | FWD | MCI | 7.0 | \xA314.5m | 6.5 |
      ARS(A) [3]\\nWatkins (id=401) | FWD | AVL | 5.5 | \xA38.5m | 5.0 | NEW(H) [3]\\nSolanke
      (id=402) | FWD | TOT | 4.0 | \xA37.5m | 3.5 | EVE(H) [2]\\nDiaz (id=310) | MID
      | LIV | 6.5 | \xA38.0m | 6.0 | SOU(H) [2]\\n\\n# Task\\nPick a captain and a
      vice-captain from the squad above for GW 30. The captain's points are doubled,
      so choose the player most likely to deliver a big haul this gameweek.\\n\\nPrioritize:\\n-
      High recent form (players on a scoring streak)\\n- Favorable upcoming fixture
      difficulty (lower number = easier match)\\n- Track record of heavy returns:
      goals and assists for attackers and midfielders, clean sheets and bonus points
      for defenders and goalkeepers\\n- The vice-captain is a backup if the captain
      doesn't play \u2014 ideally pick one from a different fixture than the captain\\n\\n#
      Rules\\n- Captain and vice-captain must be different players\\n- Prefer players
      expected to start (not on the bench), but you may pick from any of the 15 squad
      players\\n\\n# Output format\\nReturn a JSON object with these exact fields:\\n-
      captain_id: the squad player's ID for captain\\n- vice_captain_id: a different
      squad player's ID for vice-captain\\n- reasoning: 2-3 sentences citing specific
      form numbers and fixture difficulty\\n\",\"role\":\"user\"}],\"model\":\"gpt-4o-mini\",\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"schema\":{\"description\":\"Structured
      output from select_captain node.\",\"properties\":{\"captain_id\":{\"title\":\"Captain
      Id\",\"type\":\"integer\"},\"vice_captain_id\":{\"title\":\"Vice Captain Id\",\"type\":\"integer\"},\"reasoning\":{\"title\":\"Reasoning\",\"type\":\"string\"}},\"required\":[\"captain_id\",\"vice_captain_id\",\"reasoning\"],\"title\":\"CaptainPick\",\"type\":\"object\",\"additionalProperties\":false},\"name\":\"CaptainPick\",\"strict\":true}},\"stream\":false}"
