[project]
name = "fpl-strategist"
version = "0.1.0"
description = "Agentic FPL transfer strategist powered by LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "langfuse>=2.0.0",
    "langchain>=0.3.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
eval = [
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "pytest-recording>=0.13.4",
    "vcrpy>=8.1.1",
]

[project.scripts]
fpl = "fpl_strategist.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
